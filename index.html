<!doctype html>
<html lang="id" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sanz Store REST API</title>
<meta name="description" content="Sanz Store REST API: kumpulan API publik gratis untuk downloader, tools foto, pencarian, dan lainnya. Tanpa API key, langsung pakai.">
<meta name="theme-color" content="#E7EBF3">
<link rel="icon" type="image/jpeg" href="https://c.termai.cc/i159/IHiF83s.jpg">
<link rel="apple-touch-icon" href="https://c.termai.cc/i159/IHiF83s.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<script>
/* Set tema sebelum render supaya tidak berkedip */
(function(){var t=null;try{t=localStorage.getItem('sz_theme')}catch(e){}
if(!t){t=window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'}
document.documentElement.setAttribute('data-theme',t)})();
</script>
<style>
:root{
  --bg:#E7EBF3; --hi:#FFFFFF; --lo:#C6CDDC;
  --ink:#2B3347; --muted:#6B7690; --accent:#5468E8; --accent2:#8B9AFA; --ontint:#FFFFFF;
  --ok:#1FB45B; --bad:#D6453D; --focus:#5468E8; --dim:rgba(30,40,70,.45);
  --r:rgba(198,205,220,.95); --rh:rgba(255,255,255,.95);
}
[data-theme="dark"]{
  --bg:#1E2230; --hi:#2B3045; --lo:#12151F;
  --ink:#E4E8F5; --muted:#93A0C0; --accent:#8EA0FF; --accent2:#6F82F0; --ontint:#10142A;
  --ok:#43D582; --bad:#FF8A80; --focus:#8EA0FF; --dim:rgba(0,0,0,.6);
  --r:rgba(18,21,31,.9); --rh:rgba(48,54,78,.9);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;min-height:100vh;color:var(--ink);background:var(--bg);
  font:400 15px/1.6 'Sora',system-ui,sans-serif;padding-bottom:124px;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:'Sora',system-ui,sans-serif;font-weight:700;line-height:1.25;letter-spacing:-.02em;margin:0;overflow-wrap:anywhere}
h1{font-size:clamp(28px,7.5vw,42px)}
h2{font-size:clamp(18px,4.2vw,22px);margin-bottom:16px}
h3{font-size:15px;font-weight:600}
p{margin:0 0 10px;max-width:62ch}
a{color:var(--accent)}
img{max-width:100%}
.wrap{width:min(960px,100% - 32px);margin-inline:auto}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px;border-radius:12px}
.sky{display:none}

/* ---- permukaan neumorphic ---- */
.panel{background:var(--bg);border-radius:24px;box-shadow:8px 8px 18px var(--lo),-8px -8px 18px var(--hi)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;cursor:pointer;text-decoration:none;
  font:600 14px/1.3 'Sora',sans-serif;padding:13px 20px;min-height:48px;border:0;border-radius:16px;
  background:var(--accent);color:var(--ontint);box-shadow:5px 5px 12px var(--lo),-5px -5px 12px var(--hi);transition:box-shadow .15s,transform .15s}
.btn:hover{filter:brightness(1.06)}
.btn:active{box-shadow:inset 3px 3px 7px rgba(0,0,0,.28),inset -3px -3px 7px rgba(255,255,255,.12);transform:scale(.985)}
.btn.alt{background:var(--bg);color:var(--ink)}
.btn.alt:active{box-shadow:inset 4px 4px 9px var(--lo),inset -4px -4px 9px var(--hi)}
.btn[aria-disabled="true"],.btn:disabled{opacity:.5;cursor:not-allowed;filter:grayscale(.5)}
.btn.sm{font-size:12.5px;padding:9px 14px;min-height:40px;border-radius:14px}
.row{display:flex;flex-wrap:wrap;gap:12px}
.ico{display:block;flex:none}
.sec{margin-top:48px}
.state{padding:20px;border-radius:20px;background:var(--bg);box-shadow:inset 4px 4px 9px var(--lo),inset -4px -4px 9px var(--hi);max-width:62ch}
.state b{display:block;margin-bottom:6px}
.badge{display:inline-block;font:600 11px/1.4 'Sora',sans-serif;padding:5px 11px;border-radius:999px;color:var(--accent);background:var(--bg);
  box-shadow:inset 2px 2px 5px var(--lo),inset -2px -2px 5px var(--hi)}
.badge.off{color:var(--bad)}
.badge.ok{color:var(--ok)}
.ah{padding-top:28px}
.ah-badge{display:inline-flex;align-items:center;gap:10px;padding:10px 18px;border-radius:999px;background:var(--bad);color:#fff;font:700 12px/1 'Sora',sans-serif;letter-spacing:.08em;box-shadow:5px 5px 12px var(--lo),-5px -5px 12px var(--hi)}
.ah-badge i{width:10px;height:10px;border-radius:50%;background:#fff}
.ah h1{margin:22px 0 14px;font-size:clamp(30px,9vw,52px);letter-spacing:-.03em}
.ah-name{display:inline-block;padding:10px 22px;border-radius:22px;font:800 clamp(24px,7vw,40px)/1.2 'Sora',sans-serif;color:var(--accent);margin-bottom:18px}
.ah-cta{margin:22px 0 28px}
.ah-win{overflow:hidden;padding-bottom:6px}
.ah-wh{display:flex;align-items:center;gap:8px;padding:16px 18px}
.ah-wh .d{width:14px;height:14px;border-radius:50%}
.ah-wh .d.r{background:#ff6b6b}.ah-wh .d.y{background:#ffc94d}.ah-wh .d.g{background:#3ddc97}
.ah-fn{flex:1;margin-left:8px;font:500 13px/1.3 ui-monospace,Menlo,Consolas,monospace;color:var(--muted)}
.ah-win .dx-tabs{padding:0 18px 10px}
.ah-win .dx-code{margin:0 14px;padding-top:16px;max-height:260px}
.ah-wf{display:flex;justify-content:space-between;align-items:center;padding:14px 18px 10px;font:600 12px/1 ui-monospace,Menlo,Consolas,monospace;color:var(--muted)}
.ah-stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:40px;scroll-margin-top:90px}
.ast{padding:20px 18px;display:grid;gap:6px;align-content:start}
.ast-v{font:800 clamp(22px,6.2vw,34px)/1.15 'Sora',sans-serif;overflow-wrap:anywhere}
.ast-l{font:700 12.5px/1.3 'Sora',sans-serif;letter-spacing:.06em}
.ast small{color:var(--muted);font-size:12.5px;line-height:1.45}
.c1{color:var(--ok)}.c2{color:var(--accent)}.c3{color:var(--bad)}.c4{color:#D9822B}
/* ---- System Statistics ---- */
.sx{display:grid;gap:16px}
.sx-h{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.sx-title{margin:0;font:800 clamp(22px,6vw,30px)/1.2 'Sora',sans-serif}
.sx-sub{margin:0;color:var(--muted);font-size:13.5px;line-height:1.55}
.sx-live{display:inline-flex;align-items:center;gap:8px;font:700 12px 'Sora',sans-serif;letter-spacing:.08em;color:var(--ok)}
.sx-live i{width:9px;height:9px;border-radius:50%;background:var(--ok);box-shadow:0 0 12px var(--ok);animation:sxp 1.6s infinite}
.sx-live i.off{background:var(--bad);box-shadow:0 0 12px var(--bad);animation:none}
@keyframes sxp{0%{box-shadow:0 0 0 0 rgba(31,180,91,.55),0 0 12px var(--ok)}100%{box-shadow:0 0 0 12px rgba(31,180,91,0),0 0 12px var(--ok)}}
.sx-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.sx-card{padding:18px;display:grid;gap:10px;align-content:start}
.sx-wide{grid-column:1/-1}
.sx-t{font:700 12.5px/1.3 'Sora',sans-serif;letter-spacing:.06em;color:var(--muted)}
.sx-v{font:800 clamp(22px,6.2vw,32px)/1.15 'Sora',sans-serif;overflow-wrap:anywhere}
.sx-v.g{color:var(--ok)}.sx-v.a{color:var(--accent)}.sx-v.o{color:#D9822B}.sx-v.c{color:#14C8DC}
.sx-v{text-shadow:0 0 22px color-mix(in srgb,currentColor 45%,transparent)}
.sx-card small{color:var(--muted);font-size:12.5px;line-height:1.45}
.sx-big{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.sx-bar{height:12px;border-radius:99px;background:var(--bg);box-shadow:inset 3px 3px 6px var(--lo),inset -3px -3px 6px var(--hi);overflow:hidden}
.sx-bar>b{display:block;height:100%;width:2%;border-radius:99px;background:linear-gradient(90deg,var(--accent),#14C8DC);box-shadow:0 0 14px rgba(84,104,232,.7);transition:width .8s cubic-bezier(.2,.8,.2,1)}
.sx-bar.warn>b{background:linear-gradient(90deg,#D9822B,#F2B84B);box-shadow:0 0 14px rgba(217,130,43,.65)}
.sx-bar.crit>b{background:linear-gradient(90deg,#D6453D,#FF7A6B);box-shadow:0 0 14px rgba(214,69,61,.65)}
.sx-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font:600 13.5px/1.45 'Sora',sans-serif}
.sx-row>span{color:var(--muted)}
.sx-row>b{text-align:right;overflow-wrap:anywhere}
.sx-chart{display:flex;align-items:flex-end;gap:8px;height:150px}
.sx-col{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;height:100%}
.sx-col i{display:block;width:100%;max-width:34px;border-radius:9px 9px 4px 4px;background:linear-gradient(180deg,#14C8DC,var(--accent));box-shadow:0 0 14px rgba(84,104,232,.6);transition:height .8s cubic-bezier(.2,.8,.2,1)}
.sx-col em{font:700 11px 'Sora',sans-serif;font-style:normal}
.sx-col span{font:600 10.5px 'Sora',sans-serif;color:var(--muted)}
.sx-ep{display:grid;gap:7px}
.sx-list{display:grid;gap:14px}

#dx-explore{scroll-margin-top:90px}
.dx-cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.dx-cat{display:flex;align-items:center;gap:14px;padding:16px 18px;border:0;cursor:pointer;color:var(--ink);text-align:left;font:inherit;background:var(--bg)}
.dx-bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.dx-bar h2{margin:0}

/* ---- header ---- */
.top{position:sticky;top:0;z-index:20;background:var(--bg);border-radius:0 0 26px 26px;box-shadow:0 8px 18px var(--r),0 -2px 0 var(--bg)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:68px}
.brand{display:flex;align-items:center;gap:12px;color:var(--ink);text-decoration:none}
.brand span{font:700 15px/1.2 'Sora',sans-serif;letter-spacing:.01em}
.brand .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.brand-cv{display:block;flex:none}
.tools{display:flex;gap:10px}
.tool{width:44px;height:44px;padding:0;cursor:pointer;position:relative;border:0;border-radius:50%;background:var(--bg);color:var(--accent);
  box-shadow:4px 4px 9px var(--lo),-4px -4px 9px var(--hi);display:grid;place-items:center}
.tool:active{box-shadow:inset 3px 3px 7px var(--lo),inset -3px -3px 7px var(--hi)}
.tool .ico{width:20px;height:20px}
.tool.muted{color:var(--muted)}
.tool.muted::after{content:"";position:absolute;left:12px;right:12px;top:50%;height:2px;border-radius:2px;background:var(--bad);transform:rotate(-45deg)}

/* ---- navigasi bawah melayang ---- */
.hotbar{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:30;display:flex;gap:4px;padding:6px;
  width:min(480px,100% - 20px);background:var(--bg);border-radius:26px;box-shadow:8px 8px 20px var(--lo),-8px -8px 20px var(--hi)}
.slot{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:4px;padding:9px 2px 8px;border-radius:20px;
  color:var(--muted);text-decoration:none;font:600 11px/1 'Sora',sans-serif;transition:color .15s}
.slot .ico{width:22px;height:22px}
.slot:hover{color:var(--ink)}
.slot[aria-current="page"]{color:var(--accent);box-shadow:inset 4px 4px 9px var(--lo),inset -4px -4px 9px var(--hi)}

/* ---- tombol CS melayang ---- */
.fab{position:fixed;right:14px;bottom:100px;z-index:25;display:flex;align-items:center;gap:8px;min-height:50px;padding:0 18px;cursor:pointer;border:0;
  font:700 13px/1 'Sora',sans-serif;background:var(--accent);color:var(--ontint);border-radius:26px;box-shadow:6px 6px 14px var(--lo),-4px -4px 12px var(--hi)}
.fab:active{transform:scale(.97)}
[hidden]{display:none !important}

/* ---- chat CS AI ---- */
.chat{position:fixed;right:12px;bottom:96px;z-index:40;width:min(400px,100% - 24px);height:min(78vh,640px);display:flex;flex-direction:column;overflow:hidden;
  background:var(--bg);border-radius:26px;box-shadow:10px 10px 26px var(--r),-8px -8px 22px var(--rh)}
.chat>header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 10px 10px 18px;background:var(--accent);color:var(--ontint)}
.chat>header b{font:700 14px/1.3 'Sora',sans-serif;display:flex;align-items:center;gap:10px}
.chat .x{width:38px;height:38px;padding:0;cursor:pointer;display:grid;place-items:center;border:0;border-radius:50%;background:rgba(255,255,255,.2);color:inherit}
.msgs{flex:1 1 auto;min-height:140px;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;
  background:var(--bg);box-shadow:inset 0 6px 10px -6px var(--lo)}
.m{max-width:88%;padding:10px 14px;border-radius:18px;font-size:14px;line-height:1.5;overflow-wrap:anywhere}
.m.a{align-self:flex-start;border-bottom-left-radius:6px;background:var(--bg);box-shadow:4px 4px 9px var(--lo),-4px -4px 9px var(--hi)}
.m.u{align-self:flex-end;border-bottom-right-radius:6px;background:var(--accent);color:var(--ontint)}
.m img{display:block;max-width:100%;max-height:140px;border-radius:12px;margin-bottom:6px}
.m .vid{display:inline-block;padding:2px 8px;margin-bottom:6px;border-radius:8px;border:1px solid currentColor;font-size:12px}
.chips{display:flex;gap:8px;padding:10px 14px 6px;flex-wrap:nowrap;overflow-x:auto}
.chip{flex:none;white-space:nowrap;cursor:pointer;font:500 12.5px 'Sora',sans-serif;padding:8px 14px;border:0;border-radius:999px;color:var(--ink);background:var(--bg);
  box-shadow:3px 3px 7px var(--lo),-3px -3px 7px var(--hi)}
.atts{display:flex;flex-wrap:wrap;gap:8px;padding:8px 14px 0}
.att{position:relative;max-width:140px;min-width:48px;height:48px;border-radius:12px;background:var(--bg);box-shadow:inset 2px 2px 5px var(--lo),inset -2px -2px 5px var(--hi);
  display:flex;align-items:center;padding:0 24px 0 8px;font-size:12px;overflow:hidden}
.att img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.att button{position:absolute;right:2px;top:2px;width:22px;height:22px;padding:0;cursor:pointer;display:grid;place-items:center;border:0;border-radius:50%;background:var(--accent);color:var(--ontint)}
.comp{display:flex;gap:10px;padding:10px 14px;align-items:flex-end}
.comp textarea{flex:1;min-width:0;resize:none;min-height:46px;max-height:110px;padding:12px 14px;font:400 14px/1.4 'Sora',sans-serif;color:var(--ink);
  background:var(--bg);border:0;border-radius:16px;box-shadow:inset 4px 4px 9px var(--lo),inset -4px -4px 9px var(--hi)}
.comp .tool,.comp .btn{width:46px;height:46px;min-height:46px;padding:0;border-radius:16px}
.chat>footer{padding:8px 14px 14px;display:grid;gap:8px}
.chat>footer small{font-size:11.5px;color:var(--muted);line-height:1.4}

/* ---- pop up saluran ---- */
.pop{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:16px;background:var(--dim);backdrop-filter:blur(3px)}
.pop.on{display:flex}
.pop .panel{position:relative;width:min(460px,100%);padding:28px 22px 22px}
.pop h2{margin-right:48px}
.pop .x{position:absolute;right:12px;top:12px;width:42px;height:42px;padding:0;cursor:pointer;display:grid;place-items:center;border:0;border-radius:50%;
  background:var(--bg);color:var(--ink);box-shadow:4px 4px 9px var(--lo),-4px -4px 9px var(--hi)}
.pop .col{display:grid;gap:12px;margin-top:16px}

/* ---- beranda ---- */
.hero{margin-top:28px;padding:30px 24px;display:flex;flex-wrap:wrap;gap:24px;align-items:center;justify-content:space-between}
.hero .txt{flex:1 1 320px}
.hero h1{margin-bottom:14px}
.hero p{font-size:16px;color:var(--muted);margin-bottom:20px}
.hero img{width:124px;height:124px;border-radius:32px;object-fit:cover;box-shadow:8px 8px 18px var(--lo),-8px -8px 18px var(--hi)}
.grid{display:grid;gap:22px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.feat{padding:22px}
.feat .ico{color:var(--accent);margin-bottom:14px;width:30px;height:30px}
.feat h3{margin-bottom:8px}
.feat p{margin:0;font-size:14px;color:var(--muted)}
.steps{display:grid;gap:20px;counter-reset:s;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.step{padding:22px;position:relative}
.step::before{counter-increment:s;content:counter(s);display:grid;place-items:center;width:40px;height:40px;margin-bottom:14px;border-radius:50%;
  font:700 15px 'Sora',sans-serif;background:var(--accent);color:var(--ontint);box-shadow:4px 4px 9px var(--lo),-3px -3px 8px var(--hi)}
.step p{margin:0;color:var(--muted);font-size:14px}
.cta{padding:28px 24px;text-align:left}
/* ---- banner dan lencana (dibuat dari kode) ---- */
.ban{display:block;margin-top:24px;border-radius:24px;overflow:hidden;line-height:0;background:#0f2a7a;
  box-shadow:8px 8px 18px var(--lo),-8px -8px 18px var(--hi);transition:transform .2s,box-shadow .2s}
.ban:hover{transform:translateY(-2px)}
.ban img{display:block;width:100%;height:auto;aspect-ratio:auto 2109/746}
.trust{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:20px}
.trust>div{padding:14px 10px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px}
.trust .ti{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;color:var(--accent);
  background:var(--bg);box-shadow:inset 3px 3px 7px var(--lo),inset -3px -3px 7px var(--hi)}
.trust b{display:block;font-size:12.5px;line-height:1.25}
.trust small{display:block;font-size:11px;color:var(--muted);line-height:1.3}
.ask{display:flex;align-items:center;gap:14px;padding:16px 18px;flex-wrap:wrap}
.ask .ai{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:var(--ontint);flex:none;
  background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:4px 4px 10px var(--lo),-4px -4px 10px var(--hi)}
.ask .tx{flex:1 1 220px}.ask .tx b{display:block;font-size:14px}.ask .tx span{font-size:12.5px;color:var(--muted)}
.phead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-top:32px}
.phead h2{margin-top:0}.phead>div:first-child{flex:1 1 auto;min-width:0}
.cta{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.cta .ctx{flex:1 1 300px}
@media (max-width:520px){.trust{gap:8px}.trust>div{padding:12px 4px;gap:6px}.trust .ti{width:34px;height:34px;border-radius:12px}.trust b{font-size:10.5px}.trust small{font-size:9.5px}
  .phead{flex-direction:column;align-items:stretch;gap:0}}

.cta h2{margin-bottom:12px}

/* ---- produk ---- */
.search{width:100%;max-width:440px;padding:14px 18px;font:400 14.5px 'Sora',sans-serif;color:var(--ink);background:var(--bg);border:0;border-radius:18px;
  box-shadow:inset 4px 4px 9px var(--lo),inset -4px -4px 9px var(--hi)}
.search::placeholder{color:var(--muted)}
.card{display:flex;flex-direction:column;padding:14px;gap:12px;height:100%}
.card .pic{position:relative;aspect-ratio:4/3;border-radius:16px;background:var(--bg);overflow:hidden;box-shadow:inset 3px 3px 7px var(--lo),inset -3px -3px 7px var(--hi)}
.card .pic img{width:100%;height:100%;object-fit:cover;object-position:center;display:block}
.card .pic .badge{position:absolute;left:8px;top:8px;background:var(--bg);box-shadow:0 2px 8px rgba(0,0,0,.18)}
.card h3{font-size:14px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:calc(1.4em * 2)}
.card .meta{display:flex;flex-direction:column;gap:2px}
.price{font:700 17px 'Sora',sans-serif;color:var(--accent)}
.price small{display:block;font-size:11px;font-weight:500;color:var(--muted)}
.card .count{font-size:12px;margin:0;color:var(--muted)}
.card .btn{margin-top:auto;width:100%}
.grid.two{grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:stretch}
.grid.two>.card{padding:10px;gap:9px}
.grid.two .card .pic{border-radius:14px}
.grid.two .card .pic .badge{font-size:9.5px;padding:3px 8px;left:6px;top:6px}
.grid.two .card h3{font-size:12.5px}
.grid.two .price{font-size:14px;line-height:1.2}
.grid.two .card .count{font-size:11.5px}
.grid.two .btn.sm{font-size:11.5px;padding:8px;min-height:36px}
@media (min-width:700px){.grid.two{grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}.grid.two>.card{padding:12px;gap:10px}.grid.two .card h3{font-size:13.5px}.grid.two .price{font-size:15.5px}}

/* ---- layar loading awal (animasi digambar di canvas) ---- */
#splash{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;background:var(--bg);transition:opacity .9s cubic-bezier(.4,0,.2,1),visibility .9s}
#splash.hide{opacity:0;visibility:hidden;pointer-events:none}
#sp-cv{display:block;max-width:100%;animation:spFade .8s ease both}
#splash.hide #sp-cv{transform:scale(1.03);transition:transform 1s cubic-bezier(.4,0,.2,1)}
@keyframes spFade{from{opacity:0}}
/* ---- kerangka loading (skeleton) ---- */
.sk,.card .pic.sk{background:linear-gradient(90deg,rgba(128,140,170,.13) 25%,rgba(128,140,170,.3) 50%,rgba(128,140,170,.13) 75%);background-size:200% 100%;animation:shim 1.3s linear infinite;box-shadow:none}
.sk-l{height:12px;border-radius:99px}
.sk-b{height:38px;border-radius:14px;margin-top:auto}
.w80{width:80%}.w50{width:50%}.w65{width:65%}
.sk-row{display:flex;flex-direction:column;gap:10px;padding:16px;margin-bottom:14px}
@keyframes shim{from{background-position:200% 0}to{background-position:-200% 0}}
/* ---- muncul halus saat di-scroll ---- */
.rv-up{opacity:0;transform:translateY(32px) scale(.97);will-change:opacity,transform;
  transition:opacity .65s cubic-bezier(.22,.7,.2,1) var(--d,0ms),transform .65s cubic-bezier(.22,.7,.2,1) var(--d,0ms)}
.rv-up.in{opacity:1;transform:none;will-change:auto}
.btn.rv-up.in:active{transform:scale(.985)}
#main{transition:opacity .2s ease,transform .2s ease}
#main.leaving{opacity:0;transform:translateY(-10px);pointer-events:none}
.back{display:inline-flex;margin:26px 0 16px}
.detail{padding:22px}
.detail .head{display:flex;flex-wrap:wrap;gap:20px;margin-bottom:8px}
.detail .pic{width:min(220px,100%);aspect-ratio:1;border-radius:22px;overflow:hidden;background:var(--bg);box-shadow:inset 4px 4px 9px var(--lo),inset -4px -4px 9px var(--hi)}
.detail .pic img{width:100%;height:100%;object-fit:cover}
.detail .desc{white-space:pre-line;font-size:14.5px;color:var(--muted)}
.vlist{display:grid;gap:14px;margin:12px 0 24px;padding:0;border:0}
.vlist legend{font:700 15px 'Sora',sans-serif;padding:0;margin-bottom:12px}
.variant{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:14px 16px;cursor:pointer;border-radius:18px;background:var(--bg);
  box-shadow:5px 5px 11px var(--lo),-5px -5px 11px var(--hi)}
.variant:has(input:checked){box-shadow:inset 4px 4px 9px var(--lo),inset -4px -4px 9px var(--hi),0 0 0 2px var(--accent)}
.variant.off{opacity:.55}
.variant input{appearance:none;-webkit-appearance:none;margin:0;width:24px;height:24px;border-radius:50%;background:var(--bg);cursor:pointer;
  box-shadow:inset 3px 3px 6px var(--lo),inset -3px -3px 6px var(--hi)}
.variant input:checked{background:var(--accent);box-shadow:inset 0 0 0 6px var(--bg),0 0 0 2px var(--accent)}
.variant b{font-weight:600;font-size:14.5px}
.variant small{display:block;font-size:12px;color:var(--muted)}
.order{padding-top:20px;display:grid;gap:12px}
.order .sum{font-size:15px;font-weight:600;margin:0}
.order .hint{font-size:12.5px;color:var(--muted);margin:0}

/* ---- rating ---- */
.stars-row{display:inline-flex;gap:3px;color:var(--accent)}
.stars-row .e{opacity:.25}
.stars-row .ico{width:16px;height:16px}
.sumry{display:flex;flex-wrap:wrap;gap:24px;padding:22px;align-items:center}
.score{font:800 38px 'Sora',sans-serif;color:var(--accent)}
.bars{flex:1 1 220px;display:grid;gap:8px}
.bar{display:grid;grid-template-columns:20px 1fr 36px;gap:10px;align-items:center;font-size:12.5px}
.bar i{height:10px;border-radius:99px;background:var(--bg);display:block;box-shadow:inset 2px 2px 5px var(--lo),inset -2px -2px 5px var(--hi);overflow:hidden}
.bar i s{display:block;height:100%;border-radius:99px;background:var(--accent);text-decoration:none}
.rv{padding:18px;display:grid;gap:8px;align-content:start}
.rv .who{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.rv small{font-size:12px;color:var(--muted)}
.rv p{margin:0;font-size:14px}
.rvf{padding:22px;display:grid;gap:16px;margin:20px 0;position:relative}
.rvf label{display:block;font:600 13px 'Sora',sans-serif;margin-bottom:6px}
.rvf .search{max-width:none}
.rvf textarea.search{min-height:100px;resize:vertical;line-height:1.5}
.rvf .cnt{font-size:12px;color:var(--muted);text-align:right;margin-top:4px}
.rvf .hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0;pointer-events:none}
.pick{display:flex;gap:4px;flex-wrap:wrap}
.pick button{cursor:pointer;border:0;background:transparent;color:var(--accent);opacity:.25;padding:6px;min-width:44px;min-height:44px;border-radius:14px;display:grid;place-items:center;transition:opacity .15s,transform .15s}
.pick button.on{opacity:1}
.pick button:active{transform:scale(.9)}
.pick button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.pick .ico{width:30px;height:30px}
.rvf .lbl{display:block;font-size:12.5px;color:var(--muted);min-height:18px;margin-top:2px}
.rvf .err{color:var(--bad);font-size:13px;margin:0;min-height:0}

/* ---- CS ---- */
.cs{padding:22px;display:grid;gap:12px;align-content:start}
.cs .ico{color:var(--accent);width:30px;height:30px}
.cs p{margin:0;color:var(--muted);font-size:14px}

/* ---- penjelasan ---- */
.tabs{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:22px}
.tab{cursor:pointer;font:600 13px/1.3 'Sora',sans-serif;padding:11px 18px;min-height:44px;color:var(--ink);background:var(--bg);border:0;border-radius:16px;
  box-shadow:4px 4px 9px var(--lo),-4px -4px 9px var(--hi)}
.tab[aria-selected="true"]{color:var(--accent);box-shadow:inset 4px 4px 9px var(--lo),inset -4px -4px 9px var(--hi)}
details.acc{margin-bottom:14px;background:var(--bg);border-radius:20px;box-shadow:6px 6px 14px var(--lo),-6px -6px 14px var(--hi)}
details.acc>summary{list-style:none;cursor:pointer;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px;font:600 14.5px/1.5 'Sora',sans-serif}
details.acc>summary::-webkit-details-marker{display:none}
details.acc>summary::after{content:"+";display:grid;place-items:center;width:28px;height:28px;border-radius:50%;font:600 16px 'Sora',sans-serif;color:var(--accent);
  box-shadow:inset 2px 2px 5px var(--lo),inset -2px -2px 5px var(--hi)}
details.acc[open]>summary::after{content:"\2212"}
.accb{padding:4px 20px 12px}
.lst h4{font:700 12.5px/1.6 'Sora',sans-serif;margin:14px 0 6px;color:var(--accent)}
.lst ul{list-style:none;margin:0 0 8px;padding:0}
.lst li{padding-left:26px;position:relative;margin-bottom:4px;max-width:62ch;font-size:14px}
.lst li::before{position:absolute;left:0;top:0;font-weight:700}
.lst.ok li::before{content:"\2713";color:var(--ok)}
.lst.no li::before{content:"\2715";color:var(--bad)}
.lst.li li::before{content:"\2022";color:var(--accent)}
.lst.ol ul{counter-reset:o}
.lst.ol li::before{counter-increment:o;content:counter(o) ".";color:var(--accent)}
.ex,.note{margin:12px 0;padding:12px 16px;border-radius:16px;background:var(--bg);box-shadow:inset 3px 3px 7px var(--lo),inset -3px -3px 7px var(--hi)}
.ex strong,.note strong{display:block;font:700 12px 'Sora',sans-serif;margin-bottom:6px;color:var(--accent)}
.ex p,.note p{margin:0;font-size:14px}
.faq details{background:var(--bg);border-radius:18px;margin-bottom:12px;box-shadow:5px 5px 11px var(--lo),-5px -5px 11px var(--hi)}
.faq summary{cursor:pointer;padding:14px 18px;font-size:14.5px;font-weight:600}
.faq details p{padding:0 18px;margin:0 0 14px;color:var(--muted);font-size:14px}

/* ---- toast ---- */
.toast{position:fixed;left:50%;top:84px;transform:translateX(-50%);z-index:60;max-width:min(420px,100% - 32px);padding:12px 20px;border-radius:999px;
  background:var(--ink);color:var(--bg);display:none;font:500 13.5px 'Sora',sans-serif;text-align:center;box-shadow:0 10px 24px var(--r)}
.toast.on{display:block}

.variant .price{white-space:nowrap}
body.nofab .fab{display:none}
@media (max-width:520px){
  .variant{grid-template-columns:auto 1fr}
  .variant .price{grid-column:2}
  .hero{padding:24px 18px}
}
@media (max-width:360px){.slot{font-size:10px}}
@media (prefers-reduced-motion:reduce){*{transition:none !important}html{scroll-behavior:auto}.rv-up{opacity:1;transform:none}.sk{animation:none}}

/* ---- scroll halus ---- */
html{scroll-padding-top:88px;scrollbar-width:thin;scrollbar-color:var(--lo) transparent}
.msgs,.chips{overscroll-behavior:contain;scroll-behavior:smooth;-webkit-overflow-scrolling:touch}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--lo);border-radius:99px;border:3px solid var(--bg)}

/* ---- dekorasi: bikin area kosong lebih rame (garis wajik, bentuk melayang, ornamen) ---- */
:root{
  --ln:rgba(84,104,232,.10); --ln2:rgba(84,104,232,.34);
  --g1:rgba(84,104,232,.15); --g2:rgba(20,200,220,.13); --g3:rgba(88,72,248,.11);
  --lat:repeating-linear-gradient(135deg,var(--ln) 0 1px,transparent 1px 24px),repeating-linear-gradient(45deg,var(--ln) 0 1px,transparent 1px 24px);
  --orn:url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%20120%20120%27%20fill%3D%27none%27%20stroke-linecap%3D%27round%27%20stroke-linejoin%3D%27round%27%3E%3Cpath%20d%3D%27M60%206%20114%2060%2060%20114%206%2060Z%27%20stroke%3D%27%235848F8%27%20stroke-opacity%3D%27.30%27%20stroke-width%3D%271.5%27%2F%3E%3Cpath%20d%3D%27M60%2024%2096%2060%2060%2096%2024%2060Z%27%20stroke%3D%27%2314C8E0%27%20stroke-opacity%3D%27.45%27%20stroke-width%3D%271.5%27%20stroke-dasharray%3D%273%205%27%2F%3E%3Cpath%20d%3D%27M60%2042%2078%2060%2060%2078%2042%2060Z%27%20fill%3D%27%235468E8%27%20fill-opacity%3D%27.14%27%20stroke%3D%27%235468E8%27%20stroke-opacity%3D%27.35%27%20stroke-width%3D%271.2%27%2F%3E%3Cpath%20d%3D%27M46%2022%2060%208%2074%2022%27%20stroke%3D%27%23F2D40A%27%20stroke-opacity%3D%27.9%27%20stroke-width%3D%275%27%2F%3E%3Cpath%20d%3D%27M98%2046%20112%2060%2098%2074%27%20stroke%3D%27%2318C068%27%20stroke-opacity%3D%27.9%27%20stroke-width%3D%275%27%2F%3E%3Cpath%20d%3D%27M74%2098%2060%20112%2046%2098%27%20stroke%3D%27%2314C8E0%27%20stroke-opacity%3D%27.9%27%20stroke-width%3D%275%27%2F%3E%3Cpath%20d%3D%27M22%2074%208%2060%2022%2046%27%20stroke%3D%27%235848F8%27%20stroke-opacity%3D%27.9%27%20stroke-width%3D%275%27%2F%3E%3Ccircle%20cx%3D%2760%27%20cy%3D%2760%27%20r%3D%273%27%20fill%3D%27%23F2D40A%27%2F%3E%3C%2Fsvg%3E");
}
[data-theme="dark"]{--ln:rgba(142,160,255,.085);--ln2:rgba(142,160,255,.34);--g1:rgba(142,160,255,.11);--g2:rgba(20,232,248,.07);--g3:rgba(88,72,248,.16)}
.deco{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden;
  background:radial-gradient(540px 440px at 6% 5%,var(--g1),transparent 70%),radial-gradient(560px 460px at 98% 40%,var(--g2),transparent 70%),radial-gradient(540px 440px at 12% 98%,var(--g3),transparent 70%),var(--lat)}
.deco i{position:absolute;display:block;width:var(--s,26px);height:var(--s,26px);border:2px solid var(--c);border-radius:6px;opacity:.42;
  transform:rotate(45deg);animation:dfloat var(--t,9s) ease-in-out var(--d,0s) infinite alternate}
.deco i.f{background:var(--c);opacity:.2;border-color:transparent}
.deco b{position:absolute;display:block;width:var(--s,8px);height:var(--s,8px);border-radius:50%;background:var(--c);opacity:.4;animation:dpulse var(--t,5s) ease-in-out var(--d,0s) infinite alternate}
.deco u{position:absolute;display:block;width:var(--s,60px);height:var(--s,60px);border:2px dashed var(--c);border-radius:50%;opacity:.28;animation:dspin 50s linear infinite}
@keyframes dfloat{from{transform:translateY(0) rotate(45deg)}to{transform:translateY(-22px) rotate(75deg)}}
@keyframes dpulse{from{transform:scale(.7);opacity:.2}to{transform:scale(1.25);opacity:.5}}
@keyframes dspin{to{rotate:360deg}}

/* judul seksi: wajik kecil + garis putus-putus yang mengisi sisi kanan yang kosong */
.sec>h2,#main>h2{display:flex;align-items:center;gap:12px}
.sec>h2::before,#main>h2::before{content:"";flex:none;width:11px;height:11px;border-radius:3px;transform:rotate(45deg);background:linear-gradient(135deg,var(--accent),var(--accent2))}
.sec>h2::after,#main>h2::after{content:"";flex:1 1 24px;min-width:24px;height:2px;background:repeating-linear-gradient(90deg,var(--ln2) 0 7px,transparent 7px 14px)}

/* beranda: hero, ajakan chat, CTA */
.hero,.cta,.ask{position:relative;overflow:hidden;isolation:isolate}
.hero::before,.cta::before,.ask::before{content:"";position:absolute;z-index:-1;pointer-events:none;background:var(--orn) center/contain no-repeat;animation:dspin 70s linear infinite}
.hero::after,.cta::after,.ask::after{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;background:var(--lat);
  -webkit-mask-image:linear-gradient(100deg,transparent 30%,#000);mask-image:linear-gradient(100deg,transparent 30%,#000)}
.hero::before{width:250px;height:250px;right:-34px;top:50%;margin-top:-125px}
.cta::before{width:210px;height:210px;right:-30px;bottom:-46px}
.ask::before{width:110px;height:110px;right:-22px;top:50%;margin-top:-55px}

/* kartu kecil: ornamen di pojok kanan atas */
.feat,.step{background-image:var(--orn);background-repeat:no-repeat;background-position:right -24px top -24px;background-size:96px}

/* kepala halaman CS / Penjelasan: ornamen di kanan menggantikan ruang kosong */
.phead::after{content:"";flex:none;width:104px;height:104px;margin-bottom:-6px;background:var(--orn) center/contain no-repeat;animation:dspin 70s linear infinite}

/* pita berjalan */
.tick{margin-top:20px;overflow:hidden;border-radius:18px;padding:13px 0;background:var(--bg);box-shadow:inset 4px 4px 9px var(--lo),inset -4px -4px 9px var(--hi)}
.tick-t{display:flex;width:max-content;animation:tick 40s linear infinite}
.tick:hover .tick-t{animation-play-state:paused}
.tick-g{display:flex;flex:none}
.tick-g span{display:flex;align-items:center;gap:22px;padding-left:22px;font:600 12.5px/1 'Sora',sans-serif;color:var(--muted);white-space:nowrap}
.tick-g span::after{content:"";width:8px;height:8px;border-radius:2px;transform:rotate(45deg);background:var(--k,var(--accent))}
.tick-g span:nth-child(4n+1){--k:#F2D40A}.tick-g span:nth-child(4n+2){--k:#18C068}.tick-g span:nth-child(4n+3){--k:#14C8E0}.tick-g span:nth-child(4n){--k:#5848F8}
@keyframes tick{to{transform:translateX(-50%)}}

@media (max-width:520px){
  .phead::after{width:76px;height:76px;align-self:flex-end;margin:-2px 0 0}
  .hero::before{width:190px;height:190px;right:-64px;top:auto;bottom:-60px;margin-top:0}
  .cta::before{width:170px;height:170px;right:-50px;bottom:-56px}
  .ask::before{width:90px;height:90px;right:-30px;margin-top:-45px}
  .feat,.step{background-size:80px;background-position:right -22px top -22px}
  .tick-g span{font-size:11.5px;gap:18px;padding-left:18px}
}
@media (prefers-reduced-motion:reduce){.deco i,.deco b,.deco u,.hero::before,.cta::before,.ask::before,.phead::after,.tick-t{animation:none}}

/* ---- tools: HD foto ---- */
.hd{display:grid;gap:20px;margin-top:8px}
.hd .drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;min-height:190px;padding:24px;cursor:pointer;border-radius:24px;
  background:var(--bg);box-shadow:inset 5px 5px 12px var(--lo),inset -5px -5px 12px var(--hi);color:var(--muted)}
.hd .drop.over{outline:3px dashed var(--accent);outline-offset:-10px}
.hd .drop .ico{color:var(--accent);width:34px;height:34px}
.hd .drop b{color:var(--ink)}
.hd input[type=file]{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.hd .opts{display:grid;gap:16px;padding:20px}
.hd .opts label.l{display:flex;justify-content:space-between;gap:10px;font-weight:600;font-size:13.5px;margin-bottom:8px}
.hd .seg{display:flex;gap:8px;flex-wrap:wrap}
.hd .seg button{flex:1 1 70px;cursor:pointer;font:600 13px/1.3 'Sora',sans-serif;padding:11px 10px;min-height:44px;border:0;border-radius:14px;color:var(--ink);background:var(--bg);
  box-shadow:4px 4px 9px var(--lo),-4px -4px 9px var(--hi)}
.hd .seg button[aria-pressed="true"]{color:var(--accent);box-shadow:inset 4px 4px 9px var(--lo),inset -4px -4px 9px var(--hi)}
.hd input[type=range]{width:100%;accent-color:var(--accent)}
.hd .cmp{position:relative;overflow:hidden;border-radius:20px;background:var(--bg);box-shadow:inset 3px 3px 8px var(--lo),inset -3px -3px 8px var(--hi);touch-action:none;user-select:none;line-height:0}
.hd .cmp img,.hd .cmp canvas{display:block;width:100%;height:auto;max-height:70vh;object-fit:contain;margin:0 auto}
.hd .cmp .top-l{position:absolute;inset:0;clip-path:inset(0 50% 0 0)}
.hd .cmp .top-l img,.hd .cmp .top-l canvas{width:100%;height:100%;max-height:none}
.hd .cmp .bar{position:absolute;top:0;bottom:0;left:50%;width:3px;margin-left:-1.5px;background:var(--accent);box-shadow:0 0 0 1px rgba(255,255,255,.7)}
.hd .cmp .bar::after{content:"\2194";position:absolute;top:50%;left:50%;width:36px;height:36px;margin:-18px 0 0 -18px;border-radius:50%;display:grid;place-items:center;
  background:var(--accent);color:var(--ontint);font:700 16px/1 'Sora',sans-serif}
.hd .cmp .tag{position:absolute;top:10px;padding:4px 10px;border-radius:999px;font:600 11px/1.4 'Sora',sans-serif;background:rgba(0,0,0,.55);color:#fff}
.hd .info{font-size:12.5px;color:var(--muted);margin:0}
.hd progress{width:100%;height:8px;accent-color:var(--accent)}

/* ---- API Docs ---- */
.dx{display:grid;grid-template-columns:minmax(0,1fr);gap:18px;margin-top:8px}
.dx-card{overflow:hidden}
.dx-head{display:flex;align-items:center;gap:14px;width:100%;padding:16px 18px;cursor:pointer;border:0;background:none;color:var(--ink);text-align:left;font:inherit;border-radius:24px}
.dx-ico{flex:none;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:var(--accent);background:var(--bg);box-shadow:inset 3px 3px 7px var(--lo),inset -3px -3px 7px var(--hi)}
.dx-t{flex:1;min-width:0;display:grid;gap:2px}
.dx-t b{font:700 15px/1.3 'Sora',sans-serif}
.dx-t small{font-size:12.5px;color:var(--muted);line-height:1.45}
.dx-chev{color:var(--muted);transition:transform .2s}
.dx-card.open .dx-chev{transform:rotate(180deg)}
.dx-body{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;padding:4px 18px 20px;min-width:0}
.dx-body>*,.dx-try>*{min-width:0}
.dx-try{grid-template-columns:minmax(0,1fr)}
.dx-url{display:flex;align-items:center;flex-wrap:wrap;gap:10px;padding:12px;border-radius:16px;background:var(--bg);box-shadow:inset 3px 3px 7px var(--lo),inset -3px -3px 7px var(--hi)}
.dx-url code{flex:1 1 200px;min-width:0;font:500 12.5px/1.5 ui-monospace,Menlo,Consolas,monospace;overflow-wrap:anywhere}

<script>
/* Animasi loading (~4,4 detik): titik kuning mekar jadi empat garis warna yang mengitari wajik (membentuk kurung < >, berputar, memanjang-memendek), lalu menyatu jadi simbol (tetap di tempat), kemudian "SANZ STORE" dan "Safe and reliable" muncul */
function sanzLoader(cv,o){
  if(!cv||!cv.getContext) return;
  var ctx=cv.getContext("2d"), dpr=Math.min(window.devicePixelRatio||1,3);
  var K=o.k||1, W=o.W, H=o.H, cx=W/2, cy=(o.cy!=null?o.cy:H/2-6);
  cv.width=Math.round(W*K*dpr); cv.height=Math.round(H*K*dpr); cv.style.width=(W*K)+"px"; cv.style.height=(H*K)+"px"; ctx.scale(dpr*K,dpr*K);
  var reduce=window.matchMedia&&matchMedia("(prefers-reduced-motion:reduce)").matches;
  var INK="#2B3347", MUTED="#6B7690", lastCS=-1e9;
  var COL=["#F8E008","#18C068","#14E8F8","#5848F8"];      /* kuning, hijau, biru muda, ungu (warna dari video) — urut searah jarum jam */
  /* Tiap garis berjalan di keliling wajik. Posisi diukur dengan u: 0..1 sisi atas->kanan, 1..2 kanan->bawah, 2..3 bawah->kiri, 3..4 kiri->atas */
  var V=[[0,-1],[1,0],[0,1],[-1,0]];
  var RC=[0,1,2,3];                          /* awal: empat "sudut kurung" di empat penjuru */
  var FC=[-.5,.3185,1.4775,2.3185];          /* akhir: pusat tiap garis pada simbol */
  var FL=[.818,.273,.773,.273];              /* akhir: panjang tiap garis (kuning & biru panjang, hijau & ungu pendek) */
  var SWL=[.45,-.35,.45,-.35];               /* tahap tengah: kuning & biru memanjang jadi kurung, hijau & ungu memendek */
  var DS=[0,260,330,400];                    /* jeda muncul tiap garis (ms) */
  var SW=8, SSM=1.15, MSW=4.5, ORB=4, RB=30, LS=3;
  var T={R0:200,Rd:1100, r0:350,r1:2350, b0:650,b1:1650, k0:1500,k1:2600, m0:1800,m1:2900, t0:2550,ts:55,td:700, s0:3450,sd:850, end:4400};
  var TEXT="SANZ STORE", SUB="Safe and reliable", FS=o.fs||(W<330?26:30);
  var FF='Outfit,"Segoe UI",system-ui,sans-serif', FONT='600 '+FS+'px '+FF;
  function cl(x){return x<0?0:x>1?1:x}
  function eo(t){return 1-Math.pow(1-t,3)}
  function eq(t){return 1-Math.pow(1-t,4)}
  function io(t){return t*t*t*(t*(t*6-15)+10)}             /* smootherstep: mulai dan berhenti sangat halus */
  function lp(a,b,t){return a+(b-a)*t}
  function twidth(str){var w=0;for(var k=0;k<str.length;k++)w+=ctx.measureText(str[k]).width+LS;return w-LS}
  function P(u,R,mx,my){var k=Math.floor(u),f=u-k,a=V[((k%4)+4)%4],b=V[(((k+1)%4)+4)%4];return[mx+(a[0]+(b[0]-a[0])*f)*R,my+(a[1]+(b[1]-a[1])*f)*R]}
  function arc(a,b,R,mx,my,w,col){                           /* garis melengkung mengikuti sudut wajik */
    ctx.strokeStyle=col;ctx.lineWidth=w;ctx.lineCap="round";ctx.lineJoin="round";ctx.beginPath();
    var p=P(a,R,mx,my);ctx.moveTo(p[0],p[1]);
    for(var k=Math.floor(a)+1;k<b;k++){p=P(k,R,mx,my);ctx.lineTo(p[0],p[1])}
    p=P(b,R,mx,my);ctx.lineTo(p[0]+.01,p[1]+.01);ctx.stroke()}
  function layout(){ctx.font=FONT;var tw=twidth(TEXT),mw=2*22*SSM+MSW*SSM,gap=14,tot=mw+gap+tw,sx=(W-tot)/2;
    if(o.left!=null)sx=o.left;
    return{tw:tw,mcx:sx+mw/2,tx:sx+mw+gap,ly:cy-12,base:cy-12+FS*.35}}
  function draw(t){
    ctx.clearRect(0,0,W,H);
    var nw=performance.now(); if(nw-lastCS>400){lastCS=nw;var cs=getComputedStyle(document.documentElement);
      INK=(cs.getPropertyValue("--ink")||"").trim()||INK;MUTED=(cs.getPropertyValue("--muted")||"").trim()||MUTED;
      if(document.fonts&&document.fonts.check&&!document.fonts.check(FONT)&&document.fonts.load) document.fonts.load(FONT)}
    var LY=layout(), L=io(cl((t-T.m0)/(T.m1-T.m0))), kf=io(cl((t-T.k0)/(T.k1-T.k0))),
        rot=-ORB*(1-io(Math.pow(cl((t-T.r0)/(T.r1-T.r0)),.75))),                    /* putaran mengitari wajik, melambat halus di akhir */
        bump=Math.pow(Math.sin(Math.PI*cl((t-T.b0)/(T.b1-T.b0))),2),                /* napas: garis memanjang lalu memendek */
        mx=LY.mcx, my=LY.ly, R=22*SSM*eo(cl((t-T.R0)/T.Rd)), w=MSW*SSM*eo(cl(t/420)), i;   /* simbol diam di tempat (tanpa geser/zoom kamera) */
    for(i=3;i>=0;i--){
      var a=eo(cl((t-DS[i])/450)); if(a<=0) continue;
      var c=lp(RC[i],FC[i],kf)+rot, len=lp(.8+SWL[i]*bump,FL[i],kf)*a;
      arc(c-len/2,c+len/2,R,mx,my,w,COL[i]);
    }
    if(t>T.t0){   /* "SANZ STORE": tiap huruf naik pelan dari balik garis potong sambil memudar masuk */
      ctx.save();ctx.beginPath();ctx.rect(LY.tx-8,LY.base-FS*.95,LY.tw+16,FS*1.35);ctx.clip();
      ctx.font=FONT;ctx.fillStyle=INK;ctx.textBaseline="alphabetic";var xx=LY.tx;
      for(i=0;i<TEXT.length;i++){var p=eq(cl((t-T.t0-i*T.ts)/T.td)),cw=ctx.measureText(TEXT[i]).width+LS;
        if(p>0){ctx.globalAlpha=Math.min(1,p*1.6);ctx.fillText(TEXT[i],xx,LY.base+(1-p)*FS*.75)}
        xx+=cw}
      ctx.restore();ctx.globalAlpha=1;
    }
    if(o.sub!==false&&t>T.s0){   /* "Safe and reliable": muncul lembut tepat di bawah teks atas, sejajar kiri */
      var a2=eo(cl((t-T.s0)/T.sd)); ctx.globalAlpha=a2;ctx.fillStyle=MUTED;ctx.font='400 12.5px '+FF;ctx.textBaseline="alphabetic";
      var sp=3,px2=LY.tx,py2=LY.base+26+(1-a2)*8,k3;
      for(k3=0;k3<SUB.length;k3++){ctx.fillText(SUB[k3],px2,py2);px2+=ctx.measureText(SUB[k3]).width+sp}
      ctx.globalAlpha=1;
    }
  }
  var t0=performance.now();
  if(!o.loop){window.__sp0=t0; window.__spMin=reduce?600:T.end}
  if(reduce){draw(T.end);return}
  if(o.loop){   /* indikator loading: animasi diulang terus tanpa berhenti */
    var HOLD=1400, FADE=450, CYC=T.end+HOLD+FADE;
    (function lt(){var p=(performance.now()-t0)%CYC, e=p-(T.end+HOLD);
      draw(Math.min(p,T.end)); cv.style.opacity=e>0?String(1-e/FADE):"1";
      requestAnimationFrame(lt)})();
    return;
  }
  (function tick(){var t=performance.now()-window.__sp0; draw(Math.min(t,T.end)); if(t<T.end&&document.getElementById("splash")) requestAnimationFrame(tick)})();
}
/* layar loading awal */
sanzLoader(document.getElementById("sp-cv"),{W:Math.min(360,window.innerWidth-24),H:230});

function dxNorm(a){
  const m = Object.assign({ title:a.name, desc:"", method:"GET", input:"none", output:"json", params:[], order:99, category:"lainnya" }, a);
  m.category = String(m.category||"lainnya").trim().toLowerCase() || "lainnya";
  m.method = String(m.method).toUpperCase();
  m.params = (Array.isArray(m.params) ? m.params : []).map(p => Object.assign({ label:p.name, example:"" }, p));
  return m;
}
const dxEx = p => String(p.example !== undefined && p.example !== "" ? p.example : (p.options ? p.options[p.options.length-1] : "..."));
const dxExt = m => m.output==="video" ? "mp4" : m.output==="image" ? "jpg" : "json";

/* ---------- pembuat contoh kode (satu template untuk semua API) ---------- */
function dxCode(m){
  const url = apiBase() + "/api/" + m.name, file = m.input==="file", post = m.method==="POST", ps = m.params;
  const qs = ps.map(p => p.name + "=" + dxEx(p)).join("&"), full = url + (qs ? "?" + qs : "");
  const ext = dxExt(m), media = m.output!=="json", out = "hasil." + ext, inFile = "foto.jpg";
  const OCT = '"Content-Type": "application/octet-stream"';
  const L = {};

  // cURL
  L.curl = file
    ? `curl -X POST "${full}" \\\n  -H "Content-Type: application/octet-stream" \\\n  --data-binary "@${inFile}"` + (media ? ` \\\n  -o ${out}` : "")
    : `curl -X ${m.method} "${full}"` + (media ? ` \\\n  -o ${out}` : "");

  // JavaScript (browser)
  const jsOpt = file ? `, {\n  method: "POST",\n  headers: { ${OCT} },\n  body: document.querySelector("#foto").files[0]\n}` : (post ? `, { method: "POST" }` : "");
  const jsThen = !media ? `  .then(res => res.json())\n  .then(data => console.log(data))`
    : m.output==="image" ? `  .then(res => res.blob())\n  .then(blob => {\n    document.querySelector("#hasil").src = URL.createObjectURL(blob);\n  })`
    : `  .then(res => res.blob())\n  .then(blob => {\n    const a = document.createElement("a");\n    a.href = URL.createObjectURL(blob);\n    a.download = "${out}";\n    a.click();\n  })`;
  L.js = `fetch("${full}"${jsOpt})\n${jsThen}\n  .catch(err => console.error(err));`;

  // Node.js
  const setQ = ps.map(p => `u.searchParams.set("${p.name}", "${dxEx(p)}");`).join("\n");
  const nodeHead = (file || media ? 'const fs = require("fs");\n\n' : "") + `const u = new URL("${url}");\n` + (setQ ? setQ + "\n" : "");
  const nodeOpt = file ? `, {\n  method: "POST",\n  headers: { ${OCT} },\n  body: fs.readFileSync("${inFile}")\n}` : (post ? `, { method: "POST" }` : "");
  L.node = nodeHead + `\nconst res = await fetch(u${nodeOpt});\n` + (media ? `fs.writeFileSync("${out}", Buffer.from(await res.arrayBuffer()));` : `const data = await res.json();\nconsole.log(data);`);

  // Python
  const pyParams = ps.length ? `params={${ps.map(p => `"${p.name}": "${dxEx(p)}"`).join(", ")}}` : "";
  const pyWrite = media ? `\n\nwith open("${out}", "wb") as f:\n    f.write(res.content)` : `\nprint(res.json())`;
  L.py = file
    ? `import requests\n\nwith open("${inFile}", "rb") as f:\n    res = requests.post(\n        "${url}",\n        ${pyParams ? pyParams + ",\n        " : ""}data=f.read(),\n        headers={"Content-Type": "application/octet-stream"},\n    )\n${pyWrite.replace(/^\n/, "")}`
    : `import requests\n\nres = requests.${post ? "post" : "get"}("${url}"${pyParams ? ", " + pyParams : ""})${pyWrite}`;

  // PHP
  const phpUrl = ps.length ? `"${url}?" . http_build_query([${ps.map(p => `"${p.name}" => "${dxEx(p)}"`).join(", ")}])` : `"${url}"`;
  L.php = `<?php\n$ch = curl_init();\ncurl_setopt($ch, CURLOPT_URL, ${phpUrl});\n` +
    (file ? `curl_setopt($ch, CURLOPT_POST, true);\ncurl_setopt($ch, CURLOPT_POSTFIELDS, file_get_contents("${inFile}"));\ncurl_setopt($ch, CURLOPT_HTTPHEADER, ["Content-Type: application/octet-stream"]);\n`
      : post ? `curl_setopt($ch, CURLOPT_POST, true);\n` : "") +
    `curl_setopt($ch, CURLOPT_RETURNTRANSFER, true);\n$response = curl_exec($ch);\ncurl_close($ch);\n` +
    (media ? `file_put_contents("${out}", $response);` : `echo $response;`);

  // Bot WhatsApp (Baileys) & Telegram: parameter pertama (teks) diambil dari pesan user
  const argP = file ? null : ps.find(p => !p.options);
  const botQ = (pad) => ps.map(p => `${pad}u.searchParams.set("${p.name}", ${p===argP ? "arg" : `"${dxEx(p)}"`});`).join("\n");
  const fetchOpt = file ? `, {\n    method: "POST",\n    headers: { ${OCT} },\n    body: foto\n  }` : (post ? `, { method: "POST" }` : "");
  const waSend = !media ? `{ text: JSON.stringify(await res.json(), null, 2) }`
    : `{ ${m.output} : Buffer.from(await res.arrayBuffer()) }`;
  const tgSend = !media ? `bot.sendMessage(msg.chat.id, JSON.stringify(await res.json(), null, 2));`
    : `bot.send${m.output==="image" ? "Photo" : "Video"}(msg.chat.id, Buffer.from(await res.arrayBuffer()));`;

  if(file){
    L.wa = `const { downloadMediaMessage } = require("@whiskeysockets/baileys");\n\nsock.ev.on("messages.upsert", async ({ messages }) => {\n  const m = messages[0];\n  const caption = m.message?.imageMessage?.caption || "";\n  if (caption !== ".${m.name}") return;\n\n  const foto = await downloadMediaMessage(m, "buffer", {});\n  const u = new URL("${url}");\n${botQ("  ")}\n  const res = await fetch(u${fetchOpt});\n\n  await sock.sendMessage(m.key.remoteJid, ${waSend}, { quoted: m });\n});`;
    L.tg = `const TelegramBot = require("node-telegram-bot-api");\nconst bot = new TelegramBot("TOKEN_BOT", { polling: true });\n\nbot.on("photo", async (msg) => {\n  const fileId = msg.photo[msg.photo.length - 1].file_id;\n  const link = await bot.getFileLink(fileId);\n  const foto = Buffer.from(await (await fetch(link)).arrayBuffer());\n\n  const u = new URL("${url}");\n${botQ("  ")}\n  const res = await fetch(u${fetchOpt});\n  ${tgSend}\n});`;
  }else{
    const cmd = argP ? `if (!text.startsWith(".${m.name} ")) return;\n\n  const arg = text.split(" ").slice(1).join(" ");` : `if (text !== ".${m.name}") return;\n`;
    L.wa = `sock.ev.on("messages.upsert", async ({ messages }) => {\n  const m = messages[0];\n  const text = m.message?.conversation || m.message?.extendedTextMessage?.text || "";\n  ${cmd}\n  const u = new URL("${url}");\n${botQ("  ")}\n  const res = await fetch(u${fetchOpt});\n\n  await sock.sendMessage(m.key.remoteJid, ${waSend}, { quoted: m });\n});`;
    L.tg = `const TelegramBot = require("node-telegram-bot-api");\nconst bot = new TelegramBot("TOKEN_BOT", { polling: true });\n\nbot.onText(${argP ? `/\\/${m.name} (.+)/` : `/\\/${m.name}/`}, async (msg${argP ? ", match" : ""}) => {\n${argP ? "  const arg = match[1];\n" : ""}  const u = new URL("${url}");\n${botQ("  ")}\n  const res = await fetch(u${fetchOpt});\n  ${tgSend}\n});`;
  }
  return L;
}

const SX = { tok:0, t1:0, t2:0 };
function sxBytes(n){
  if(n==null || isNaN(n)) return "\u2013";
  const u = ["B","KB","MB","GB","TB"]; let i = 0; n = Number(n);
  while(n >= 1024 && i < u.length-1){ n /= 1024; i++; }
  return n.toLocaleString("id-ID", { maximumFractionDigits: i ? 1 : 0 }) + " " + u[i];
}
function initStats(){
  const tok = ++SX.tok; clearInterval(SX.t1); clearInterval(SX.t2);
  const g = id => document.getElementById(id);
  const set = (id, v) => { const e = g(id); if(e) e.textContent = v; };
  const fmt = n => Number(n||0).toLocaleString("id-ID");
  const bar = (id, p) => { const e = g(id); if(!e) return; e.className = "sx-bar" + (p >= 90 ? " crit" : p >= 75 ? " warn" : ""); e.firstElementChild.style.width = Math.max(2, Math.min(100, p)) + "%"; };
  const live = (ok, txt) => { const d = g("sx-dot"); if(d) d.className = ok ? "" : "off"; set("sx-live", txt); };
  let since = null, off = 0;
  const pull = () => {
    if(!g("sx-root") || tok !== SX.tok){ clearInterval(SX.t1); clearInterval(SX.t2); return; }
    if(document.hidden) return;
    const t0 = performance.now();
    fetch("/api/list?sys=1", { cache:"no-store" }).then(r => { if(!r.ok) throw 0; return r.json(); }).then(d => {
      if(tok !== SX.tok || !g("sx-root")) return;
      const ping = Math.round(performance.now() - t0), st = d.stats, sy = d.sys || {};
      if(st){
        set("sx-total", fmt(st.total)); set("sx-today", fmt(st.today)); set("sx-month", fmt(st.month));
        off = st.now ? new Date(st.now).getTime() - Date.now() : 0;
        since = st.since ? new Date(st.since).getTime() : null;
        const l7 = st.last7 || [], mx = Math.max(1, ...l7.map(x => x.n));
        g("sx-chart").innerHTML = l7.map(x => `<div class="sx-col"><em>${fmt(x.n)}</em><i style="height:${x.n ? Math.round(x.n/mx*86) + 6 : 4}px"></i><span>${x.day.slice(8)}/${x.day.slice(5,7)}</span></div>`).join("");
        const ent = Object.entries(st.byApi || {}).sort((a,b) => b[1] - a[1]), tot = st.total || 0;
        g("sx-api").innerHTML = ent.length ? ent.map(([k,v]) => { const p = tot ? Math.round(v/tot*100) : 0; return `<div class="sx-ep"><div class="sx-row"><span>${esc(k)}</span><b>${fmt(v)} <small>(${p}%)</small></b></div><div class="sx-bar"><b style="width:${Math.max(p,2)}%"></b></div></div>`; }).join("") : `<small>Belum ada request tercatat.</small>`;
        set("sx-fb", d.fbMs != null ? d.fbMs + " ms" : "\u2013");
      }else{
        ["sx-total","sx-today","sx-month","sx-fb"].forEach(i => set(i, "\u2013"));
        since = null;
        g("sx-api").innerHTML = `<small>Firebase belum terhubung, cek variabel di Vercel.</small>`;
      }
      const m = sy.mem;
      if(m && m.total){ const used = m.total - m.free, p = Math.round(used/m.total*100);
        set("sx-mem-pct", p + "%"); bar("sx-mem-bar", p);
        set("sx-mem-used", sxBytes(used)); set("sx-mem-free", sxBytes(m.free)); set("sx-mem-total", sxBytes(m.total));
        set("sx-mem-rss", sxBytes(m.rss)); set("sx-mem-heap", sxBytes(m.heapUsed) + " / " + sxBytes(m.heapTotal)); }
      const dk = sy.disk;
      if(dk && dk.total){ const used = dk.total - dk.free, p = Math.round(used/dk.total*100);
        set("sx-disk-pct", p + "%"); bar("sx-disk-bar", p);
        set("sx-disk-used", sxBytes(used)); set("sx-disk-free", sxBytes(dk.free)); set("sx-disk-total", sxBytes(dk.total)); set("sx-disk-path", dk.path); }
      else { set("sx-disk-pct", "\u2013"); }
      const c = sy.cpu || {};
      set("sx-cores", c.cores ? c.cores + " core" : "\u2013");
      set("sx-load", (c.load || []).map(x => Number(x).toFixed(2)).join(" \u00b7 ") || "\u2013");
      set("sx-cpu", c.model || "\u2013"); set("sx-arch", [sy.platform, sy.arch].filter(Boolean).join(" / ") || "\u2013");
      set("sx-node", sy.node || "\u2013"); set("sx-region", sy.region || "\u2013"); set("sx-env", sy.env || "\u2013");
      set("sx-fnmem", sy.fnMemMb ? sy.fnMemMb + " MB" : "\u2013");
      set("sx-inst", sy.uptimeS != null ? dxUptime(sy.uptimeS * 1000) : "\u2013");
      set("sx-ping", ping + " ms"); set("sx-commit", sy.commit || "\u2013");
      live(true, "LIVE");
    }).catch(() => { if(tok === SX.tok) live(false, "OFFLINE"); });
  };
  const tick = () => { if(!g("sx-root") || tok !== SX.tok){ clearInterval(SX.t1); clearInterval(SX.t2); return; } set("sx-run", since ? dxUptime(Date.now() + off - since) : "\u2013"); };
  pull(); SX.t1 = setInterval(pull, 5000); SX.t2 = setInterval(tick, 1000);
}

function dxResize(file, max){
  return new Promise((ok, fail) => {
    const u = URL.createObjectURL(file), im = new Image();
    im.onload = () => {
      const k = Math.min(1, max / Math.max(im.naturalWidth, im.naturalHeight));
      const cv = document.createElement("canvas"); cv.width = Math.max(1, Math.round(im.naturalWidth*k)); cv.height = Math.max(1, Math.round(im.naturalHeight*k));
      const cx = cv.getContext("2d"); cx.imageSmoothingQuality = "high"; cx.drawImage(im, 0, 0, cv.width, cv.height);
      URL.revokeObjectURL(u); cv.toBlob(b => b ? ok(b) : fail(new Error("Foto gagal disiapkan.")), "image/jpeg", .9);
    };
    im.onerror = () => { URL.revokeObjectURL(u); fail(new Error("Foto tidak bisa dibuka. Coba file lain.")); };
    im.src = u;
  });
}
function dxSplit(card, pct){
  pct = Math.max(0, Math.min(100, pct));
  const top = card.querySelector(".top-l"), bar = card.querySelector(".bar"); if(!top || !bar) return;
  top.style.clipPath = `inset(0 ${100-pct}% 0 0)`; bar.style.left = pct + "%";
}
async function dxRun(card, m){
  const s = DX.st[m.name]; if(s.busy) return;
  const file = m.input==="file";
  if(file && !s.file){ toast("Pilih foto dulu."); return; }
  const missing = m.params.find(p => !p.options && !String(s.vals[p.name]||"").trim());
  if(missing){ toast("Isi dulu: " + missing.label + "."); return; }

  const go = card.querySelector("[data-run]"), prog = card.querySelector("[data-prog]"), res = card.querySelector("[data-res]"), dl = card.querySelector("[data-dl]");
  s.busy = true; const tok = ++s.token; go.disabled = true; go.textContent = "Memproses..."; dl.disabled = true; prog.hidden = false; prog.removeAttribute("value");
  res.innerHTML = ""; const ctl = new AbortController(), to = setTimeout(() => ctl.abort(), 90000);
  try{
    const qs = new URLSearchParams(); m.params.forEach(p => qs.set(p.name, s.vals[p.name]));
    const url = apiBase() + "/api/" + m.name + (qs.toString() ? "?" + qs : "");
    let opt = { method:m.method, signal:ctl.signal };
    if(file){
      const body = m.resize ? await dxResize(s.file, m.resize) : s.file;
      opt = { method:"POST", headers:{ "Content-Type":"application/octet-stream" }, body, signal:ctl.signal };
    }
    const r = await fetch(url, opt);
    const ct = r.headers.get("content-type") || "";
    if(!r.ok){
      let msg = "", raw = ""; try{ raw = await r.text(); const j = JSON.parse(raw); msg = j.message || j.error || ""; raw = JSON.stringify(j, null, 2) }catch(e){}
      if(tok===s.token && raw) res.innerHTML = `<pre class="dx-code dx-json" tabindex="0"><code>${esc("HTTP " + r.status + "\n" + raw)}</code></pre>`;
      throw new Error(msg || ("Server membalas " + r.status + (r.status===413 ? " (foto terlalu besar)" : "")));
    }
    if(tok!==s.token) return;
    if(/^(image|video)\//.test(ct)){
      s.blob = await r.blob(); if(tok!==s.token) return;
      const u = URL.createObjectURL(s.blob);
      if(/^video\//.test(ct)) res.innerHTML = `<video controls playsinline src="${u}" style="width:100%;border-radius:18px"></video>`;
      else if(file && s.origUrl) res.innerHTML = `<div class="cmp"><img src="${s.origUrl}" alt="Foto asli"><div class="top-l"><img src="${u}" alt="Hasil"></div><i class="bar"></i><span class="tag" style="left:10px">Asli</span><span class="tag" style="right:10px">Hasil</span></div><p class="info" style="margin-top:10px">Geser garis untuk membandingkan.</p>`;
      else res.innerHTML = `<img src="${u}" alt="Hasil" style="border-radius:18px">`;
      if(res.querySelector(".cmp")) dxSplit(card, 50);
      dl.disabled = false;
    }else{
      const t = await r.text(); let shown = t; try{ shown = JSON.stringify(JSON.parse(t), null, 2) }catch(e){}
      s.blob = null; res.innerHTML = `<pre class="dx-code dx-json" tabindex="0"><code>${esc(shown)}</code></pre>`;
    }
    toast("Selesai!");
  }catch(e){
    toast(e.name==="AbortError" ? "Server terlalu lama membalas. Coba lagi." : e instanceof TypeError ? "Tidak bisa terhubung ke server." : (e.message || "Gagal memproses."));
  }finally{
    clearTimeout(to); s.busy = false; go.disabled = false; go.textContent = "Jalankan";
    setTimeout(() => { prog.hidden = true; }, 500);
  }
}
function dxPick(card, m, f){
  const s = DX.st[m.name];
  if(!f || !/^image\//.test(f.type)){ toast("Pilih file gambar (JPG, PNG, atau WebP)."); return; }
  if(f.size > 25*1024*1024){ toast("Ukuran foto maksimal 25 MB."); return; }
  if(s.origUrl) URL.revokeObjectURL(s.origUrl);
  s.file = f; s.origUrl = URL.createObjectURL(f); s.token++; s.blob = null;
  card.querySelector("[data-drop]").hidden = true; card.querySelector("[data-reset]").hidden = false;
  card.querySelector("[data-dl]").disabled = true;
  card.querySelector("[data-res]").innerHTML = `<div class="cmp"><img src="${s.origUrl}" alt="Foto asli"></div>`;
  const im = new Image(); im.onload = () => { card.querySelector("[data-info]").textContent = `Foto ${im.naturalWidth}×${im.naturalHeight} px` + (m.resize && Math.max(im.naturalWidth, im.naturalHeight) > m.resize ? `, dikecilkan ke maks ${m.resize} px sebelum dikirim.` : "."); }; im.src = s.origUrl;
}
function dxDownload(m){
  const s = DX.st[m.name]; if(!s.blob) return;
  const ext = /png/.test(s.blob.type) ? "png" : /webp/.test(s.blob.type) ? "webp" : /mp4|video/.test(s.blob.type) ? "mp4" : "jpg";
  const base = s.file ? (s.file.name||"foto").replace(/\.[^.]+$/, "") : m.name;
  const a = document.createElement("a"); a.href = URL.createObjectURL(s.blob); a.download = `${base}-${m.name}.${ext}`;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
async function dxCopy(text){
  try{ await navigator.clipboard.writeText(text); toast("Disalin!"); }
  catch(e){ const t = document.createElement("textarea"); t.value = text; t.style.position = "fixed"; t.style.opacity = "0"; document.body.appendChild(t); t.select();
    try{ document.execCommand("copy"); toast("Disalin!"); }catch(_){ toast("Gagal menyalin. Salin manual."); } t.remove(); }
}

/* ---------- kategori, uptime, perangkat ---------- */
const CAT_ICO = { tools:"bolt", downloader:"send", search:"book", lainnya:"chest" };
const catLabel = c => c.charAt(0).toUpperCase() + c.slice(1);
function dxExplore(){
  const root = $("#dx"); if(!root) return;
  if(!DX.list || !DX.list.length){ root.innerHTML = `<div class="state"><b>Belum ada API</b>Tambahkan file baru di folder api/ pada repo.</div>`; return; }
  if(!DX.cat){
    const g = {}; DX.list.forEach(m => (g[m.category] = g[m.category] || []).push(m));
    const keys = Object.keys(g).sort((a,b) => (a==="lainnya") - (b==="lainnya") || a.localeCompare(b));
    root.innerHTML = `<h2>Pilih kategori</h2><div class="dx-cats">` + keys.map(c => `<button class="panel dx-cat" type="button" data-cat="${esc(c)}"><span class="dx-ico">${ico(CAT_ICO[c] || "bolt", 22)}</span><span class="dx-t"><b>${esc(catLabel(c))}</b><small>${g[c].length} endpoint</small></span><svg class="dx-chev ico" style="transform:rotate(-90deg)" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>`).join("") + `</div>`;
  }else{
    root.innerHTML = `<div class="dx-bar"><button class="btn alt sm" type="button" data-back>&larr; Kategori</button><h2>${esc(catLabel(DX.cat))}</h2></div>` + DX.list.filter(m => m.category===DX.cat).map(dxCard).join("");
  }
}
function dxUptime(ms){
  let t = Math.max(0, Math.floor(ms/1000));
  const d = Math.floor(t/86400), h = Math.floor(t%86400/3600), m = Math.floor(t%3600/60), s = t%60;
  return (d ? d + "h " : "") + (d || h ? h + "j " : "") + m + "m " + s + "d";
}
function dxDevice(){
  const ua = navigator.userAgent || "", mob = /Mobi/i.test(ua);
  const br = /Edg\//.test(ua) ? "Edge" : /OPR\/|Opera/.test(ua) ? "Opera" : /Firefox/.test(ua) ? "Firefox" : /Chrome|CriOS/.test(ua) ? "Chrome" : /Safari/.test(ua) ? "Safari" : "Browser";
  let os, type;
  if(/iPad/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1)){ os = "iOS"; type = "Tablet"; }
  else if(/iPhone|iPod/.test(ua)){ os = "iOS"; type = "Ponsel"; }
  else if(/Android/.test(ua)){ os = "Android"; type = mob ? "Ponsel" : "Tablet"; }
  else if(/CrOS/.test(ua)){ os = "ChromeOS"; type = "Laptop"; }
  else if(/Windows/.test(ua)){ os = "Windows"; type = "Laptop / PC"; }
  else if(/Mac OS X|Macintosh/.test(ua)){ os = "macOS"; type = "Laptop / PC"; }
  else if(/Linux|X11/.test(ua)){ os = "Linux"; type = "Laptop / PC"; }
  else { os = "Perangkat lain"; type = mob ? "Ponsel" : "Laptop / PC"; }
  return [os, type + " \u00b7 " + br];
}

function initTools(){
  const root = $("#dx"); if(!root) return;
  const tok = ++DX.tok;
  clearInterval(DX.t1); clearInterval(DX.t2); DX.cat = null;
  const draw = list => {
    if(tok!==DX.tok) return;
    DX.list = list.map(dxNorm).sort((a,b) => (a.order-b.order) || a.name.localeCompare(b.name));
    DX.list.forEach(m => { if(!DX.st[m.name]) DX.st[m.name] = { lang:"curl", vals:Object.fromEntries(m.params.map(p => [p.name, p.options ? dxEx(p) : ""])), file:null, origUrl:null, blob:null, busy:false, token:0 }; });
    $("#st-ep").textContent = DX.list.length.toLocaleString("id-ID");
    const ex = DX.list.find(m => m.input!=="file" && m.method==="GET") || DX.list[0];
    if(ex){ DX.hero = dxCode(ex); DX.wl = "js"; $("#ah-code").textContent = DX.hero.js; $("#ah-win").hidden = false; }
    dxExplore();
  };
  const [os, sub] = dxDevice(); $("#st-dev").textContent = os; $("#st-dev2").textContent = sub;
  fetch("/api/list").then(r => { if(!r.ok) throw 0; return r.json(); }).then(j => { if(!Array.isArray(j)) throw 0; draw(j); }).catch(() => draw(DEMO_APIS));
  let off = 0, since = null;
  const fmt = n => Number(n||0).toLocaleString("id-ID");
  const pull = () => { if(document.hidden) return; fetch("/api/list?stats=1", { cache:"no-store" }).then(r => { if(!r.ok) throw 0; return r.json(); }).then(st => {
    if(tok!==DX.tok || !$("#st-total")) return;
    $("#st-total").textContent = fmt(st.total);
    $("#st-sub").textContent = "Hari ini " + fmt(st.today) + " \u00b7 Bulan ini " + fmt(st.month);
    off = st.now ? new Date(st.now).getTime() - Date.now() : 0;
    since = st.since ? new Date(st.since).getTime() : null;
  }).catch(() => {}); };
  const tick = () => {
    const el = $("#st-up");
    if(tok!==DX.tok || !el){ clearInterval(DX.t1); clearInterval(DX.t2); return; }
    el.textContent = since ? dxUptime(Date.now() + off - since) : "\u2013";
  };
  pull(); DX.t1 = setInterval(pull, 5000); DX.t2 = setInterval(tick, 1000);

  const hero = $("#ah-root");
  hero.addEventListener("click", e => {
    if(e.target.closest("[data-explore]")){ location.hash = "#/explore"; return; }
    if(e.target.closest("[data-gostats]")){ location.hash = "#/stats"; return; }
    const wl = e.target.closest("[data-wl]");
    if(wl && DX.hero){ DX.wl = wl.dataset.wl; $("#ah-code").textContent = DX.hero[DX.wl]; $("#ah-kind").textContent = DX.wl==="js" ? "FETCH" : "CURL";
      hero.querySelectorAll("[data-wl]").forEach(b => b.setAttribute("aria-pressed", String(b===wl))); return; }
    if(e.target.closest("[data-wcopy]")) return dxCopy($("#ah-code").textContent);
    const cat = e.target.closest("[data-cat]"); if(cat){ DX.cat = cat.dataset.cat; dxExplore(); $("#dx-explore").scrollIntoView({ behavior:"smooth", block:"start" }); return; }
    if(e.target.closest("[data-back]")){ DX.cat = null; dxExplore(); }
  });

  const find = card => DX.list.find(x => x.name===card.dataset.name);
  function openCard(card){
    const m = find(card), body = card.querySelector(".dx-body"), btn = card.querySelector("[data-tog]");
    const open = body.hidden;
    if(open && !body.innerHTML){ body.innerHTML = dxBody(m); dxShowCode(card, m); }
    body.hidden = !open; btn.setAttribute("aria-expanded", String(open)); card.classList.toggle("open", open);
  }
  root.addEventListener("click", e => {
    const card = e.target.closest(".dx-card"); if(!card) return;
    const m = find(card); if(!m) return;
    if(e.target.closest("[data-tog]")) return openCard(card);
    const s = DX.st[m.name];
    const lang = e.target.closest("[data-lang]"); if(lang){ s.lang = lang.dataset.lang; return dxShowCode(card, m); }
    if(e.target.closest("[data-copy]")) return dxCopy(card.querySelector(".dx-code code").textContent);
    if(e.target.closest("[data-copyurl]")) return dxCopy(card.querySelector(".dx-url code").textContent);
    const seg = e.target.closest("[data-seg] button"); if(seg){ const g = seg.closest("[data-seg]"); s.vals[g.dataset.seg] = seg.dataset.v; g.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b===seg))); return; }
    if(e.target.closest("[data-run]")) return dxRun(card, m);
    if(e.target.closest("[data-dl]")) return dxDownload(m);
    if(e.target.closest("[data-reset]")){ s.token++; s.file = null; s.blob = null; if(s.origUrl){ URL.revokeObjectURL(s.origUrl); s.origUrl = null; }
      card.querySelector("[data-drop]").hidden = false; card.querySelector("[data-reset]").hidden = true; card.querySelector("[data-res]").innerHTML = ""; card.querySelector("[data-info]").textContent = ""; card.querySelector("[data-dl]").disabled = true; }
  });
  root.addEventListener("input", e => {
    const i = e.target.closest("[data-in]"); if(!i) return; const card = i.closest(".dx-card"), m = find(card);
    DX.st[m.name].vals[i.dataset.in] = i.value;
  });
  root.addEventListener("change", e => {
    const f = e.target.closest("[data-file]"); if(!f) return; const card = f.closest(".dx-card");
    if(f.files[0]) dxPick(card, find(card), f.files[0]); f.value = "";
  });
  ["dragenter","dragover"].forEach(ev => root.addEventListener(ev, e => { const d = e.target.closest("[data-drop]"); if(d){ e.preventDefault(); d.classList.add("over"); } }));
  ["dragleave","drop"].forEach(ev => root.addEventListener(ev, e => { const d = e.target.closest("[data-drop]"); if(d){ e.preventDefault(); d.classList.remove("over"); } }));
  root.addEventListener("drop", e => { const d = e.target.closest("[data-drop]"); if(!d) return; const card = d.closest(".dx-card"); const f = e.dataTransfer && e.dataTransfer.files[0]; if(f) dxPick(card, find(card), f); });
  let drag = null;
  root.addEventListener("pointerdown", e => { const c = e.target.closest(".cmp"); if(!c || !c.querySelector(".bar")) return; drag = c; c.setPointerCapture(e.pointerId); const r = c.getBoundingClientRect(); dxSplit(c.closest(".dx-card"), (e.clientX-r.left)/r.width*100); });
  root.addEventListener("pointermove", e => { if(!drag) return; const r = drag.getBoundingClientRect(); dxSplit(drag.closest(".dx-card"), (e.clientX-r.left)/r.width*100); });
  root.addEventListener("pointerup", () => { drag = null; });
  root.addEventListener("pointercancel", () => { drag = null; });
}

/* =====================  ROUTER  ===================== */
const NAV = [["tools","Beranda","house"],["explore","Explore","bolt"],["stats","Statistik","shield"]];
const TITLES = { tools:"API Docs", explore:"Explore API", stats:"System Statistics" };
function parse(){
  const h = location.hash.replace(/^#\/?/,"");
  const parts = h.split("/"); let page = parts.shift() || "tools";
  if(!TITLES[page]) page = "tools";
  let arg = null; try { arg = parts.length ? decodeURIComponent(parts.join("/")) : null } catch(e) {}
  return { page, arg };
}
let lastRoute = "";
function render(scroll=true, instant=false){
  const {page} = parse();
  if(page !== lastRoute){ SEEN.clear(); lastRoute = page; }
  const main = $("#main");
  main.innerHTML = page==="explore" ? vExplore() : page==="stats" ? vStats() : vTools();
  document.querySelectorAll(".slot").forEach(a=>{
    if(a.dataset.p===page) a.setAttribute("aria-current","page"); else a.removeAttribute("aria-current");
  });
  document.title = C.NAME;
  if(page==="tools"||page==="explore") initTools();
  if(page==="stats") initStats();
  tagReveal(main);
  watchReveal(main);
  if(scroll){ window.scrollTo({top:0,behavior:instant?"instant":"smooth"}); }
}
let navT = 0;
addEventListener("hashchange",()=>{
  if(matchMedia("(prefers-reduced-motion:reduce)").matches){ render(true); return; }
  const m = $("#main"); clearTimeout(navT);
  m.classList.add("leaving");                                   // halaman lama memudar
  navT = setTimeout(()=>{ render(true,true); m.classList.remove("leaving"); },190);   // ganti isi saat tak terlihat, lalu memudar masuk
});

function copyText(t){
  if(navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(t).then(()=>true,()=>fallbackCopy(t));
  return Promise.resolve(fallbackCopy(t));
}
function fallbackCopy(t){
  try{ const a=document.createElement("textarea"); a.value=t; a.setAttribute("readonly",""); a.style.cssText="position:fixed;opacity:0";
    document.body.appendChild(a); a.select(); const ok=document.execCommand("copy"); a.remove(); return ok; }catch(e){ return false }
}
let tT;
function toast(m){ const t=$("#toast"); t.textContent=m; t.classList.add("on"); clearTimeout(tT); tT=setTimeout(()=>t.classList.remove("on"),4200); }

/* ---------- tema ---------- */
function applyTheme(t){
  document.documentElement.setAttribute("data-theme",t);
  const b = $("#theme-btn");
  b.innerHTML = ico(t==="dark"?"sun":"moon",28);
  b.setAttribute("aria-label", t==="dark" ? "Ganti ke mode terang" : "Ganti ke mode gelap");
  const m = document.querySelector('meta[name="theme-color"]'); if(m) m.content = t==="dark" ? "#10264F" : "#1F6FE0";
}
$("#theme-btn").addEventListener("click",()=>{
  const n = document.documentElement.getAttribute("data-theme")==="dark" ? "light" : "dark";
  lsSet("sz_theme",n); applyTheme(n);
});

/* ---------- musik ---------- */
const bgm = $("#bgm"), mb = $("#music-btn");
let wantMusic = lsGet("sz_music")!=="off", started = false;
let trk = 0, fails = 0;
bgm.src = C.PLAYLIST[0]; bgm.volume = .5;
function nextTrack(){
  trk = (trk+1) % C.PLAYLIST.length;
  bgm.src = C.PLAYLIST[trk];
  if(wantMusic) bgm.play().catch(()=>{});
}
function musicUI(){
  const on = !bgm.paused;
  mb.innerHTML = ico("note",28);
  mb.classList.toggle("muted",!on);
  mb.setAttribute("aria-pressed",String(on));
  mb.setAttribute("aria-label", on ? "Matikan musik" : "Putar musik");
}
function tryPlay(){ if(!wantMusic) return; bgm.play().then(musicUI).catch(musicUI); }
["pointerdown","keydown"].forEach(ev=>addEventListener(ev,e=>{
  if(started || (e.target.closest && e.target.closest("#music-btn"))) return;
  started = true; tryPlay();
},{passive:true}));
mb.addEventListener("click",()=>{
  started = true;
  if(bgm.paused){ wantMusic = true; lsSet("sz_music","on"); bgm.play().then(musicUI).catch(()=>{ toast("Musik belum bisa diputar. Coba lagi."); musicUI(); }); }
  else { wantMusic = false; lsSet("sz_music","off"); bgm.pause(); musicUI(); }
});
bgm.addEventListener("play",musicUI); bgm.addEventListener("pause",musicUI);
bgm.addEventListener("ended",nextTrack);                        // lagu habis -> lagu berikutnya
bgm.addEventListener("playing",()=>{ fails = 0; });
bgm.addEventListener("error",()=>{                              // link lagu mati -> lewati ke berikutnya
  if(++fails >= C.PLAYLIST.length){ mb.hidden = true; return; }
  nextTrack();
});

/* Scroll lembut (mouse/trackpad). Layar sentuh tetap pakai scroll bawaan HP yang sudah halus. */
(function(){
  if(matchMedia("(prefers-reduced-motion:reduce)").matches) return;
  if(!matchMedia("(hover:hover) and (pointer:fine)").matches) return;
  let target=scrollY, cur=scrollY, raf=0;
  const max=()=>document.documentElement.scrollHeight-innerHeight;
  function tick(){
    cur+=(target-cur)*0.11;
    if(Math.abs(target-cur)<0.4){ cur=target; raf=0; } else { raf=requestAnimationFrame(tick); }
    scrollTo({top:cur,behavior:"instant"});
  }
  function inner(el){
    for(;el&&el!==document.body;el=el.parentElement){
      const o=getComputedStyle(el).overflowY;
      if((o==="auto"||o==="scroll")&&el.scrollHeight>el.clientHeight) return true;
    }
    return false;
  }
  addEventListener("wheel",e=>{
    if(e.ctrlKey||e.defaultPrevented||inner(e.target)) return;
    e.preventDefault();
    const d=e.deltaMode===1?e.deltaY*32:e.deltaMode===2?e.deltaY*innerHeight:e.deltaY;
    target=Math.max(0,Math.min(max(),target+d));
    if(!raf) raf=requestAnimationFrame(tick);
  },{passive:false});
  addEventListener("scroll",()=>{ if(!raf){ target=cur=scrollY; } },{passive:true});
})();
